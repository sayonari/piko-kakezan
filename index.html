<body>

<script>
'use strict';
// =====================================================================
//  ピコピコかけざん — ならべて かぞえて おぼえる 九九
// =====================================================================

// ---------- palette (PICO-8 風) ----------
const P = {black:'#000000', navy:'#1d2b53', plum:'#7e2553', dgreen:'#008751', brown:'#ab5236',
  dgray:'#5f574f', lgray:'#c2c3c7', white:'#fff1e8', red:'#ff004d', orange:'#ffa300',
  yellow:'#ffec27', green:'#00e436', blue:'#29adff', lav:'#83769c', pink:'#ff77a8', peach:'#ffccaa'};
const TEN = {dark:'#4a1d00', base:'#ffa300', hi:'#ffe28c', lo:'#d45f00'};
const ONE = {dark:'#06204a', base:'#29adff', hi:'#c4f0ff', lo:'#1868c0'};
const FIRE = [P.yellow, P.orange, P.pink, P.green, P.blue, P.white, P.red, P.peach];
const FONT = '"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif';

// ---------- utils ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const E = {
  linear: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

// ---------- save ----------
const KEY = 'piko-kakezan-v1';
const SAVE = {best: {}, stars: 0, sfx: true, voice: true, bgm: true};
try { Object.assign(SAVE, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch (e) {} }

// ---------- tweens / timers / flows ----------
let tweens = [], timers = [];
function tw(o, to, dur, opt = {}) {
  return new Promise(res => tweens.push({o, to, dur, t: -(opt.delay || 0), ease: opt.ease || E.outCubic, from: null, res}));
}
function updTweens(dt) {
  const list = tweens.slice();
  for (const t of list) {
    t.t += dt; if (t.t < 0) continue;
    if (!t.from) { t.from = {}; for (const k in t.to) t.from[k] = t.o[k]; }
    const p = Math.min(1, t.t / t.dur), e = t.ease(p);
    for (const k in t.to) t.o[k] = t.from[k] + (t.to[k] - t.from[k]) * e;
    if (p >= 1) { const i = tweens.indexOf(t); if (i >= 0) tweens.splice(i, 1); t.res(); }
  }
}
const wait = s => new Promise(r => timers.push({t: s, r}));
function updTimers(dt) {
  const list = timers.slice();
  for (const tm of list) if ((tm.t -= dt) <= 0) { timers.splice(timers.indexOf(tm), 1); tm.r(); }
}
let flowId = 0; const CANCEL = {cancel: 1};
function mkFlow(id) {
  return { alive: () => id === flowId,
    check() { if (id !== flowId) throw CANCEL; },
    async sleep(s) { await wait(s); if (id !== flowId) throw CANCEL; } };
}
const newFlow = () => mkFlow(++flowId);
const curFlow = () => mkFlow(flowId);
const run = p => p.catch(e => { if (e !== CANCEL) console.error(e); });

// =====================================================================
//  SOUND (WebAudio chiptune)
// =====================================================================
const S = {ac: null};
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function audioInit() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  if (!S.ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = S.ac = new AC();
    S.master = ac.createGain(); S.master.gain.value = 0.7; S.master.connect(ac.destination);
    S.sfxBus = ac.createGain(); S.sfxBus.connect(S.master);
    S.musBus = ac.createGain(); S.musBus.gain.value = 0.3; S.musBus.connect(S.master);
    // lo-fi noise (sample & hold)
    const len = ac.sampleRate; const buf = ac.createBuffer(1, len, ac.sampleRate); const d = buf.getChannelData(0);
    let v = 0; for (let i = 0; i < len; i++) { if (i % 4 === 0) v = Math.random() * 2 - 1; d[i] = v; }
    S.nbuf = buf;
    const pulse = duty => { const n = 32, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) re[k] = 4 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
      return ac.createPeriodicWave(re, im); };
    S.p25 = pulse(0.25); S.p12 = pulse(0.125);
    // iOS unlock
    const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
    applySound();
  }
  if (S.ac.state !== 'running') S.ac.resume();
}
function applySound() {
  if (!S.ac) return;
  S.sfxBus.gain.value = SAVE.sfx ? 1 : 0;
  if (SAVE.bgm) BGM.start(); else BGM.stop();
}
function tone(f, dur, o = {}) {
  if (!S.ac) return;
  const ac = S.ac, t = o.at != null ? o.at : ac.currentTime + (o.delay || 0);
  const osc = ac.createOscillator(), g = ac.createGain();
  const ty = o.type || 'p25';
  if (ty === 'p25') osc.setPeriodicWave(S.p25); else if (ty === 'p12') osc.setPeriodicWave(S.p12); else osc.type = ty;
  osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f * o.slide), t + dur);
  const v = o.vol != null ? o.vol : 0.12;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v, t + 0.006);
  g.gain.setValueAtTime(v, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.dest || S.sfxBus);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, o = {}) {
  if (!S.ac) return;
  const ac = S.ac, t = o.at != null ? o.at : ac.currentTime + (o.delay || 0);
  const src = ac.createBufferSource(); src.buffer = S.nbuf; src.loop = true;
  const fl = ac.createBiquadFilter(); fl.type = o.ft || 'lowpass';
  fl.frequency.setValueAtTime(o.f || 3000, t);
  if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
  const g = ac.createGain(); const v = o.vol != null ? o.vol : 0.1;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(fl); fl.connect(g); g.connect(o.dest || S.sfxBus);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}
const SCALE = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
const sfx = {
  tap() { tone(mf(84), .05, {vol: .1}); tone(mf(91), .06, {delay: .04, vol: .08}); },
  pop(i) { tone(mf(67 + SCALE[i % SCALE.length]), .08, {type: 'p12', vol: .1}); },
  land(i) { tone(mf(72 + SCALE[i % SCALE.length]), .07, {vol: .1}); noise(.04, {vol: .05, f: 5000}); },
  count(i) { tone(mf(72 + SCALE[i % SCALE.length]), .1, {type: 'square', vol: .09}); },
  whoosh() { noise(.35, {vol: .12, ft: 'bandpass', f: 600, f2: 4000}); tone(mf(55), .3, {type: 'triangle', slide: 4, vol: .12}); },
  merge() { tone(mf(60), .35, {type: 'p25', slide: 2.5, vol: .08}); noise(.3, {vol: .08, ft: 'bandpass', f: 800, f2: 5000}); },
  shine() { [84, 88, 91, 96, 88, 91, 96, 100].forEach((m, i) => tone(mf(m), .07, {delay: i * .045, type: 'p12', vol: .08})); },
  carry() {
    noise(.5, {vol: .25, f: 3000, f2: 200});
    tone(mf(48), .5, {type: 'triangle', slide: 3, vol: .25});
    [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => tone(mf(m), .1, {delay: .05 + i * .04, vol: .1}));
  },
  jump() { tone(mf(60), .25, {slide: 3.5, vol: .1}); },
  thud() { noise(.2, {vol: .2, f: 900, f2: 100}); tone(mf(40), .18, {type: 'triangle', slide: .5, vol: .3}); },
  correct() {
    tone(mf(88), .14, {vol: .14}); tone(mf(84), .45, {delay: .14, vol: .14}); // ピン ポーン
    tone(mf(64), .14, {type: 'triangle', vol: .25}); tone(mf(60), .45, {delay: .14, type: 'triangle', vol: .25});
    [84, 88, 91, 96].forEach((m, i) => tone(mf(m), .08, {delay: .5 + i * .06, type: 'p12', vol: .08}));
  },
  wrong() { tone(mf(50), .16, {type: 'square', vol: .1}); tone(mf(46), .4, {delay: .18, type: 'square', vol: .1, slide: .85}); },
  coin() { tone(988, .08, {type: 'square', vol: .1}); tone(1319, .4, {delay: .08, type: 'square', vol: .1}); },
  combo(n) { for (let i = 0; i < Math.min(n + 2, 10); i++) tone(mf(72 + SCALE[i]), .07, {delay: i * .05, vol: .09}); },
  boom() { noise(.6, {vol: .22, f: 2500, f2: 150}); },
  select() { tone(mf(79), .06, {vol: .1}); tone(mf(84), .06, {delay: .06, vol: .1}); tone(mf(91), .12, {delay: .12, vol: .1}); },
  start() { [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => tone(mf(m), .09, {delay: i * .05, vol: .1})); },
  fanfare() {
    const mel = [[72, 0, .12], [72, .15, .12], [72, .3, .12], [72, .45, .35], [68, .85, .35], [70, 1.25, .35], [72, 1.65, .2], [70, 1.85, .12], [72, 2.0, .9]];
    mel.forEach(([m, d, l]) => { tone(mf(m + 12), l, {delay: d, vol: .12}); tone(mf(m + 4), l, {delay: d, type: 'p12', vol: .06}); });
    [[48, 0], [48, .45], [44, .85], [46, 1.25], [48, 1.65], [48, 2.0]].forEach(([m, d]) => tone(mf(m), .35, {delay: d, type: 'triangle', vol: .25}));
  },
};

// ---------- BGM (ループする ちいさな きょく) ----------
const LEAD = [72,0,72,74,76,0,72,0, 77,0,76,0,74,0,0,0, 74,0,74,76,77,0,74,0, 79,0,77,0,76,0,0,0,
              72,0,76,0,79,0,84,0, 81,0,79,0,77,0,76,0, 74,0,77,0,76,0,74,0, 72,0,0,0,0,0,0,0];
const BASS = [48,0,55,0,48,0,55,0, 53,0,57,0,55,0,59,0, 55,0,59,0,55,0,59,0, 48,0,55,0,48,0,55,0,
              48,0,52,0,55,0,52,0, 53,0,57,0,53,0,57,0, 55,0,59,0,55,0,59,0, 48,0,55,0,48,0,0,0];
const BGM = {timer: null, step: 0, next: 0, st: .19,
  start() { if (!S.ac || this.timer) return; this.step = 0; this.next = S.ac.currentTime + .1; this.timer = setInterval(() => this.tick(), 40); },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; },
  tick() {
    const ac = S.ac; const st = this.st || .19;
    while (this.next < ac.currentTime + .2) {
      const i = this.step % 64, at = this.next;
      if (LEAD[i]) tone(mf(LEAD[i]), st * .9, {at, vol: .07, dest: S.musBus});
      if (BASS[i]) tone(mf(BASS[i]), st * 1.8, {at, type: 'triangle', vol: .22, dest: S.musBus});
      if (i % 2 === 1) noise(.03, {at, vol: .04, ft: 'highpass', f: 7000, dest: S.musBus});
      if (i % 8 === 4) noise(.08, {at, vol: .06, f: 2500, dest: S.musBus});
      this.next += st; this.step++;
    }
  }};

// ---------- こえ ----------
let jaVoice = null;
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
  jaVoice = vs.find(v => /kyoko/i.test(v.name)) || vs.find(v => /o-ren|otoya|hattori/i.test(v.name)) || vs[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(t, delay = 0) {
  if (!SAVE.voice || !window.speechSynthesis) return;
  const go = () => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
      u.rate = 1.0; u.pitch = 1.25; u.volume = 1; speechSynthesis.speak(u);
    } catch (e) {}
  };
  if (delay) setTimeout(go, delay * 1000); else go();
}

// =====================================================================
//  CANVAS / DRAW HELPERS
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, T = 0, shake = 0;
const L = {};
const STARS = Array.from({length: 90}, () => ({x: Math.random(), y: Math.random(), p: Math.random() * 6, s: Math.random() < .2 ? 2 : 1}));

const DIG = {
  '0': ['01110','10001','10011','10101','11001','10001','01110'],
  '1': ['00100','01100','00100','00100','00100','00100','01110'],
  '2': ['01110','10001','00001','00010','00100','01000','11111'],
  '3': ['11111','00010','00100','00010','00001','10001','01110'],
  '4': ['00010','00110','01010','10010','11111','00010','00010'],
  '5': ['11111','10000','11110','00001','00001','10001','01110'],
  '6': ['00110','01000','10000','11110','10001','10001','01110'],
  '7': ['11111','00001','00010','00100','01000','01000','01000'],
  '8': ['01110','10001','10001','01110','10001','10001','01110'],
  '9': ['01110','10001','10001','01111','00001','00010','01100'],
  '+': ['00000','00100','00100','11111','00100','00100','00000'],
  '=': ['00000','00000','11111','00000','11111','00000','00000'],
  '?': ['01110','10001','00001','00010','00100','00000','00100'],
  ' ': ['00000','00000','00000','00000','00000','00000','00000'],
};
// ピクセル数字: cols は 1色 or 文字ごとの配列
function ptext(str, x, y, px, cols, o = {}) {
  const cw = 6 * px, tw = str.length * cw - px;
  const sx = o.align === 'left' ? x : o.align === 'right' ? x - tw : x - tw / 2;
  const sy = y - 3.5 * px;
  const passes = o.shadow === false ? [0] : [1, 0];
  for (const pass of passes) {
    const off = pass ? Math.max(1, px * .4) : 0;
    for (let i = 0; i < str.length; i++) {
      const g = DIG[str[i]]; if (!g) continue;
      ctx.fillStyle = pass ? (o.shadowCol || 'rgba(0,0,0,.55)') : (typeof cols === 'string' ? cols : (cols[i] || P.white));
      for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++)
        if (g[r][k] === '1') ctx.fillRect(sx + i * cw + k * px + off, sy + r * px + off, px + .6, px + .6);
    }
  }
  return tw;
}
const numCols = n => n >= 10 ? [TEN.base, ONE.base] : [ONE.base];
function eqCols(a, b) { return [...numCols(a), P.white, ...numCols(b), P.white]; }

function jtext(t, x, y, size, col, o = {}) {
  ctx.font = `${Math.round(size)}px ${FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.outline !== false) {
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * .22); ctx.strokeStyle = o.outline || '#000';
    ctx.strokeText(t, x, y);
  }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
}
// ベベル付きキューブ
function cube(x, y, s, col) {
  const o = Math.max(1, s * .07), b = Math.max(1, s * .16);
  ctx.fillStyle = col.dark; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = col.lo; ctx.fillRect(x + o, y + o, s - 2 * o, s - 2 * o);
  ctx.fillStyle = col.base; ctx.fillRect(x + o, y + o, s - 2 * o - b, s - 2 * o - b);
  ctx.fillStyle = col.hi; ctx.fillRect(x + o, y + o, s - 2 * o - b, b); ctx.fillRect(x + o, y + o, b, s - 2 * o - b);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(x + o + b * .5, y + o + b * .5, b * .7, b * .7);
}
function rod(x, y, s, col) {
  ctx.fillStyle = col.dark; ctx.fillRect(x - s * .05, y - s * .05, s * 1.1, s * 10.1);
  for (let i = 0; i < 10; i++) cube(x, y + i * s, s, col);
}
const SPR = {
  cat: ['..1.......1..', '.121.....121.', '.12211111221.', '.12222222221.', '1222222222221', '1220222220221', '1220222220221', '1232222222321', '1222220222221', '.12222222221.', '..111111111..'],
  catHappy: ['..1.......1..', '.121.....121.', '.12211111221.', '.12222222221.', '1222222222221', '1222222222221', '1200222220021', '1232222222321', '1222200022221', '.12222222221.', '..111111111..'],
  star: ['...1...', '..111..', '1111111', '.11111.', '..111..', '.11.11.', '11...11'],
};
function sprite(rows, x, y, px, pal) {
  for (let r = 0; r < rows.length; r++) for (let k = 0; k < rows[r].length; k++) {
    const ch = rows[r][k]; if (ch === '.') continue;
    ctx.fillStyle = pal[ch]; ctx.fillRect(x + k * px, y + r * px, px + .6, px + .6);
  }
}
const CATPAL = {'0': '#1d1d2b', '1': '#1d1d2b', '2': P.yellow, '3': P.pink};
function drawStar(cx, cy, size, col) {
  const px = size / 7; sprite(SPR.star, cx - size / 2 + px * .4, cy - size / 2 + px * .4, px, {'1': 'rgba(0,0,0,.5)'});
  sprite(SPR.star, cx - size / 2, cy - size / 2, px, {'1': col});
}

// ---------- particles / popups ----------
let parts = [], pops = [];
function burst(x, y, n, cols = FIRE, spd = 1, size = 1) {
  const u = L.u || 400;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * u * .55 * spd;
    const life = .5 + Math.random() * .7;
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - u * .15 * spd, life, max: life, col: pick(cols), sz: u * (.008 + Math.random() * .012) * size});
  }
}
function popText(t, x, y, size, col, o = {}) { pops.push({t, x, y, size, col, life: o.life || 1.2, max: o.life || 1.2, pix: o.pix, cols: o.cols}); }
function updFx(dt) {
  const g = (L.u || 400) * 1.3;
  for (const p of parts) { p.vy += g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.y -= (L.u || 400) * .12 * dt; p.life -= dt; }
  pops = pops.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
}
function drawFx() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life / p.max * 1.5, 0, 1); ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
  for (const p of pops) {
    const k = p.life / p.max, sc = k > .85 ? 1 + (k - .85) * 4 : 1;
    ctx.globalAlpha = clamp(k * 2.5, 0, 1);
    if (p.pix) ptext(p.t, p.x, p.y, p.size * sc / 7, p.cols || p.col);

function makeQs(st, si) {

function makeChoices(a, b) {

  ctx.globalAlpha = 1;
  scenes.play.clearBtns.forEach(drawBtn);
}

// ---------- あそび の ながれ ----------
async function countdown() {
  const f = newFlow();
  Object.assign(G, {phase: 'intro', qA: 0});
  await f.sleep(.4);
  if (G.mode === 'fever') await FV.countdown(f);
  else {
    for (const t of ['3', '2', '1']) {
      popText(t, L.x0 + L.w / 2, L.y0 + L.h * .45, L.u * .3, P.yellow, {pix: true, life: .9}); tone(mf(72), .15, {vol: .12});
      await f.sleep(.8);
    }
    popText('スタート!', L.x0 + L.w / 2, L.y0 + L.h * .45, L.u * .12, P.green, {life: 1}); tone(mf(84), .4, {vol: .14});
  }
  G.running = true;
  await newQuestion();
}
async function newQuestion() {
  const f = newFlow(), pb = scenes.play, fast = G.mode === 'time' || G.mode === 'fever';
  let a, b;
  if (fast) { do { a = rnd(2, 9); b = rnd(1, 9); } while (a * 10 + b === G.last); } else [a, b] = G.qs[G.q];
  G.last = a * 10 + b;
  Object.assign(G, {a, b, ans: a * b, hinted: false, hinting: false, missed: false, phase: 'intro', reveal: 0, qA: 0,
    bd: {aS: 0, bS: 0, xS: 0, line: 0, box: 0, aP: 0, bP: 0, tF: 0, oF: 0}, hint: 0, ladder: [], beams: [], rings: [],
    rays: 0, rayC: null, big: null, dT: null, dO: null, chantN: 0});
  G.cat.happy = 0;
  const ch = makeChoices(a, b);
  pb.choices.forEach((bt, i) => Object.assign(bt, {val: ch[i], en: true, vis: false, sc: 0, shake: 0}));
  Object.assign(pb.count, {vis: false, sc: 0});
  if (!fast) sfx.whoosh();
  tw(G, {qA: 1}, fast ? .2 : .45, {ease: E.outBack});
  const k = fast ? .3 : 1;
  await f.sleep(.2 * k);
  tw(G.bd, {aS: 1}, .4 * k, {ease: E.outBack}); sfx.pop(2);
  await f.sleep(.2 * k);
  tw(G.bd, {xS: 1}, .45 * k, {ease: E.outBack}); tw(G.bd, {bS: 1}, .4 * k, {delay: .1 * k, ease: E.outBack}); sfx.pop(4);
  await f.sleep(.25 * k);
  tw(G.bd, {line: 1}, .3 * k, {ease: E.outCubic}); noise(.25, {vol: .08, ft: 'bandpass', f: 1500, f2: 6000});
  tw(G.bd, {box: 1}, .3 * k, {delay: .15 * k});
  await f.sleep(.35 * k);
  if (!fast) speak(`${a} かける ${b} は?`);
  G.phase = 'ask';
  pb.choices.forEach((bt, i) => { bt.vis = true; tw(bt, {sc: 1}, fast ? .2 : .35, {delay: i * (fast ? .03 : .08), ease: E.outBack}); });
  if (!fast) { pb.count.vis = true; tw(pb.count, {sc: 1}, .35, {delay: .25, ease: E.outBack}); }
  if (!G.hintShown && !fast) { G.hintShown = true; say('こまったら「ヒント」を おしてね', 3); }
}
async function doHint() {
  if (G.hinted || G.hinting) return;
  const f = curFlow(), pb = scenes.play;
  G.hinting = true;
  tw(pb.count, {sc: 0}, .2, {ease: E.inCubic}).then(() => { pb.count.vis = false; });
  sfx.merge();
  await tw(G, {hint: 1}, .45, {ease: E.inOutCubic}); f.check();
  const step = G.b > 6 ? .22 : .3;
  for (let k = 1; k <= G.b; k++) {
    const row = {k, a: 0, sc: 1.7}; G.ladder.push(row);
    tw(row, {a: 1, sc: 1}, .25, {ease: E.outBack});
    sfx.count(k - 1);
    await f.sleep(step);
  }
  G.hinted = true; G.hinting = false;
}
async function answerAnim(f, fast) {
  const s = G.ans, t = Math.floor(s / 10), o = s % 10, bd = G.bd, tf = hissanTf();
  const cT = {x: colX(1), y: BOX_Y}, cO = {x: colX(2), y: BOX_Y};
  const mid = {x: 5, y: BOX_Y};
  const scr = q => ({x: L.mat.x + (tf.hx + q.x * tf.hs) * L.c, y: L.mat.y + (tf.vy + q.y * tf.hs) * L.c});
  const mk = (v, x, y, s0, col) => ({v, x, y, s: s0, g: 0, col});
  if (fast) {
    if (t) { G.dT = mk(t, cT.x, cT.y, 0, TEN.base); tw(G.dT, {s: 1}, .2, {ease: E.outBack}); }
    G.dO = mk(o, cO.x, cO.y, 0, ONE.base); tw(G.dO, {s: 1}, .2, {ease: E.outBack});
    bd.tF = t ? 1 : 0; bd.oF = 1; tw(bd, {tF: 0, oF: 0}, .4);
    return;
  }
  // 1. ふたつの かずが ひかる
  sfx.shine();
  tw(bd, {aP: 1}, .2).then(() => tw(bd, {aP: .4}, .3));
  tw(bd, {bP: 1}, .2, {delay: .12}).then(() => tw(bd, {bP: .4}, .3));
  await f.sleep(.4);
  // 2. ビームが あつまる
  const aPos = {x: colX(2), y: ROW_A}, bPos = {x: colX(2), y: ROW_B};
  G.beams = [{p0: aPos, c: {x: -1.5, y: 7}, p1: mid, p: 0, a: 1, col: AC},
             {p0: bPos, c: {x: 11, y: 8.5}, p1: mid, p: 0, a: 1, col: GRP}];
  tone(mf(48), .6, {type: 'p25', slide: 4, vol: .1}); noise(.6, {vol: .1, ft: 'bandpass', f: 400, f2: 6000});
  G.beams.forEach(bm => tw(bm, {p: 1}, .6, {ease: E.inCubic}));
  await f.sleep(.6);
  // 3. どかーん!
  sfx.carry(); shake = .5;
  const sm = scr(mid);
  burst(sm.x, sm.y, 60, [P.yellow, P.white, AC, GRP], 1.3, 1.2);
  G.rayC = mid; tw(G, {rays: 1}, .3);
  for (const [d, col] of [[0, P.white], [.12, P.yellow], [.24, AC]]) {
    const r = {x: mid.x, y: mid.y, r: .5, a: 1, col}; G.rings.push(r); tw(r, {r: 9, a: 0}, .9, {delay: d, ease: E.outCubic});
  }
  G.beams.forEach(bm => tw(bm, {a: 0}, .3));
  tw(bd, {aP: 0, bP: 0}, .5);
  G.big = {x: mid.x, y: mid.y, s: 0, a: 1}; tw(G.big, {s: 1.6}, .35, {ease: E.outBack});
  await f.sleep(.7);
  // 4. 十のくらい と 一のくらい に わかれる
  const w = 6 * .4 * 1.6;
  G.big.a = 0;
  const moves = [];
  if (t) { G.dT = mk(t, mid.x - w / 2, mid.y, 1.6, TEN.base); G.dT.g = 1; moves.push(tw(G.dT, {x: cT.x, y: cT.y, s: 1}, .45, {ease: E.inOutCubic})); }
  G.dO = mk(o, t ? mid.x + w / 2 : mid.x, mid.y, 1.6, ONE.base); G.dO.g = 1; moves.push(tw(G.dO, {x: cO.x, y: cO.y, s: 1}, .45, {ease: E.inOutCubic}));
  tone(mf(72), .3, {slide: 1.5, vol: .08});
  await Promise.all(moves); f.check();
  sfx.thud(); shake = .25;
  for (const [d, c, col] of [[t ? G.dT : null, cT, TEN.base], [G.dO, cO, ONE.base]]) {
    if (!d) continue;
    const r = {x: c.x, y: c.y, r: .3, a: 1, col}; G.rings.push(r); tw(r, {r: 3.5, a: 0}, .5, {ease: E.outCubic});
    const sc = scr(c); burst(sc.x, sc.y, 18, [col, P.white], .6, .8);
    tw(d, {g: .35}, .6);
  }
  bd.tF = t ? 1 : 0; bd.oF = 1; tw(bd, {tF: 0, oF: 0}, .6);
  // 5. となえる
  speak(kuku(G.a, G.b));
  tw(G, {chantN: kuku(G.a, G.b).length + .99}, 1.1, {ease: E.linear});
  tw(G, {rays: 0}, 1.2, {delay: .8});
}
async function onChoice(btn) {
  if (G.phase !== 'ask' || !btn.en) return;
  const f = curFlow(), pb = scenes.play, fast = G.mode === 'time' || G.mode === 'fever';
  if (btn.val !== G.ans) {
    sfx.wrong(); btn.en = false; btn.shake = 1; tw(btn, {shake: 0}, .5);
    G.missed = true; G.combo = 0;
    G.cat.shake = 1; tw(G.cat, {shake: 0}, .5);
    if (G.mode === 'fever') { FV.miss(); G.time = Math.max(0, G.time - 3); popText('-3びょう', btn.x + btn.w / 2, btn.y, L.u * .06, P.red); }
    if (fast) return;
    if (!G.hinted && !G.hinting) { say('おしい! ヒントを みてみよう'); run(doHint()); }
    else if (G.b === 1) say('×1 は そのままの かずだよ');
    else say(`ひとつ うえの こたえ に +${G.a} だよ`);
    return;
  }
  G.phase = 'done'; G.combo++;
  if (!G.missed) SAVE.master[`${G.a}x${G.b}`] = 1;
  burst(btn.x + btn.w / 2, btn.y + btn.h / 2, fast ? 25 : 45, FIRE, 1.2, 1.1);
  tw(btn, {sc: 1.08}, .15, {ease: E.outBack});
  pb.choices.forEach(b => { if (b !== btn) tw(b, {sc: 0}, .2, {ease: E.inCubic}); });
  if (pb.count.vis) tw(pb.count, {sc: 0}, .2).then(() => { pb.count.vis = false; });
  G.cat.happy = 1; tw(G.cat, {jump: 1}, .15, {ease: E.outCubic}).then(() => tw(G.cat, {jump: 0}, .2, {ease: E.inCubic}));
  if (G.mode === 'fever') {
    const mult = Math.min(10, 1 + Math.floor(G.combo / 5)), pts = 10 * mult;
    G.score += pts; G.right++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.time = Math.min(45, G.time + 2);
    FV.hit(btn.x + btn.w / 2, btn.y + btn.h / 2, G.combo);
    popText(`+${pts}` + (mult > 1 ? ` ×${mult}` : ''), btn.x + btn.w / 2, btn.y - L.u * .02, L.u * .06, P.yellow);
    tw(G, {reveal: 1}, .2, {ease: E.outBack});
    await answerAnim(f, true);
    save();
    await f.sleep(.4);
    if (G.running) await newQuestion();
    return;
  }
  if (fast) {
    G.score++; sfx.coin(); if (G.combo >= 3) sfx.combo(Math.min(G.combo, 8));
    tw(G, {reveal: 1}, .2, {ease: E.outBack});
    await answerAnim(f, true);
    if (G.combo >= 3) popText(`${G.combo}れんぞく!`, L.x0 + L.w / 2, L.mat.y + L.mat.h * .5, L.u * .08, pick([P.yellow, P.pink, P.green]), {life: .8});
    save();
    await f.sleep(.45);
    if (G.running) await newQuestion();
    return;
  }
  sfx.correct();
  say(pick(PRAISE), 1.8, P.red);
  G.flyers.push({x: btn.x + btn.w / 2, y: btn.y + btn.h / 2, t: -.15, dur: .75, i: G.q, gold: !G.missed});
  while (G.hinting) await f.sleep(.1);
  await answerAnim(f, false);
  tw(G, {reveal: 1}, .5, {ease: E.outBack});
  burst(G.eqPos.x, G.eqPos.y, 25, [P.yellow, P.white, P.pink], .7, .8);
  if (G.combo >= 3) {
    await f.sleep(.3);
    popText(`${G.combo}れんぞく!`, L.x0 + L.w / 2, L.mat.y + L.mat.h * .3, L.u * .09, pick([P.yellow, P.pink, P.green]), {life: 1.4});
    sfx.combo(G.combo);
  }
  save();
  await f.sleep(2.2);
  G.q++;
  if (G.q >= G.n) await stageClear(f); else await newQuestion();
}
function showClear() {
  const pb = scenes.play;
  G.clear = {t: 0, a: 0, rec: G.clear && G.clear.rec};
  tw(G.clear, {a: 1}, .5);
  pb.choices.forEach(b => b.vis = false); pb.count.vis = false;
  sfx.fanfare();
}
async function stageClear(f) {
  const pb = scenes.play;
  G.phase = 'clear';
  const earned = G.stars.filter(s => s > 0).length, golds = G.stars.filter(s => s === 2).length;
  SAVE.stars += earned; SAVE.best[G.si] = Math.max(SAVE.best[G.si] || 0, golds); save();
  showClear(); speak(`${G.st.name} クリア! すごいね!`, .3);
  await f.sleep(1.2);
  pb.clearBtns.forEach((b, i) => { b.vis = !(b === pb.next && G.si >= STAGES.length - 1); b.sc = 0; tw(b, {sc: 1}, .4, {delay: i * .1, ease: E.outBack}); });
}
async function timeUp() {
  const f = newFlow(), pb = scenes.play;
  G.phase = 'clear';
  const rec = G.score > (SAVE.best[G.si] || 0);
  if (rec) SAVE.best[G.si] = G.score;
  SAVE.stars += G.mode === 'fever' ? G.right : G.score; save();
  G.clear = {rec}; showClear();
  if (G.mode === 'fever') speak(`${G.score}てん! さいだい ${G.maxCombo} コンボ!` + (rec ? ' しんきろく!' : ''), .3);
  else speak(`${G.score}もん せいかい!` + (rec ? ' しんきろく!' : ''), .3);
  await f.sleep(1.2);
  pb.clearBtns.forEach((b, i) => { b.vis = b !== pb.next; b.sc = 0; tw(b, {sc: 1}, .4, {delay: i * .1, ease: E.outBack}); });
}

// =====================================================================
//  LAYOUT / LOOP / INPUT
// =====================================================================
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  layout();
}
function layout() {
  const cs = getComputedStyle(document.getElementById('safe'));
  const sa = {t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0};
  Object.assign(L, {x0: sa.l + 4, y0: sa.t + 2, w: W - sa.l - sa.r - 8, h: H - sa.t - sa.b - 6});
  L.portrait = L.h > L.w * 1.05;
  L.u = Math.min(L.w, L.h);
  L.bar = clamp(L.u * .11, 44, 84);
  if (scene && scene.layout) scene.layout();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  updTweens(dt); updTimers(dt); updFx(dt); FV.update(dt);
  if (scene) scene.update(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawBg(); FV.drawBack();
  if (shake > 0) { const a = shake * L.u * .03; ctx.translate((Math.random() - .5) * a, (Math.random() - .5) * a); }
  scene.draw();
  drawFx(); FV.drawFront();
  requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const x = e.clientX, y = e.clientY;
  if (sceneName === 'title') { scene.tap(); return; }
  if (scene.tapFree && scene.tapFree(x, y)) return;
  let list = scene.btns || [];
  if (sceneName === 'play' && G && G.clear) list = scene.clearBtns;
  for (let i = list.length - 1; i >= 0; i--) {
    const b = list[i];
    if (hit(b, x, y)) { b.press = 1; b.onTap(b); return; }
  }
}, {passive: false});
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', () => setTimeout(resize, 50));
document.addEventListener('visibilitychange', () => {
  if (!S.ac) return;
  if (document.hidden) { BGM.stop(); S.ac.suspend(); if (window.speechSynthesis) speechSynthesis.cancel(); }
  else { S.ac.resume(); applySound(); }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

setScene('title');
resize();
(document.fonts && document.fonts.load ? document.fonts.load(`20px "DotGothic16"`) : Promise.resolve()).catch(() => {}).finally(() => {});
requestAnimationFrame(frame);
</script>
